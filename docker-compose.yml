services:
  escapehub-backend:
    image: ghcr.io/Texnologia-Logismikou-2026/escapehub-backend:${IMAGE_TAG:-v0.2.0}
    container_name: escapehub-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      JAVA_OPTS: ""

  postgres:
    image: postgres:16-alpine
    container_name: escapehub-postgres
    environment:
      POSTGRES_DB: escapehub
      POSTGRES_USER: escapehub_user
      POSTGRES_PASSWORD: escapehub_password
    ports:
      - "5432:5432"
    volumes:
      - escapehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escapehub_user -d escapehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  escapehub_pgdata: